version: '3.8'

services:
  # 1. CORE APPLICATION (Next.js)
  app:
    image: node:22-alpine
    container_name: tpw_app
    restart: unless-stopped
    ports:
      - "80:3000"  # Akses langsung lewat IP server di port 80
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "npm install && npm run build && npm start"
    environment:
      - VLLM_URL=http://llm:11434
      - STT_URL=http://stt:9000
      - TTS_URL=http://tts:10200
    depends_on:
      - llm

  # 2. AI SPEECH-TO-TEXT (Whisper)
  stt:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: tpw_stt
    restart: unless-stopped
    environment:
      - ASR_MODEL=base
      - ASR_ENGINE=openai_whisper

  # 3. AI TEXT-TO-SPEECH (Piper)
  tts:
    image: rhasspy/piper:latest
    container_name: tpw_tts
    restart: unless-stopped
    command: ["--model", "zh_CN-huayan-medium.onnx", "--download-dir", "/app/models"]
    volumes:
      - ./piper-data:/app/models

  # 4. LLM ENGINE (Evaluator / Ollama)
  llm:
    image: ollama/ollama:latest
    container_name: tpw_llm
    restart: unless-stopped
    volumes:
      - ./ollama_data:/root/.ollama